# Render Blueprint — "receita" de deploy.
# No dashboard do Render: New + → Blueprint → escolher este repositório.
# Cria automaticamente 1 web service (backend a servir o frontend) + 1 Postgres.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: service01-db
    plan: free # Nota: o Postgres gratuito do Render expira após ~30 dias; para uso contínuo, subir de plano.

services:
  - type: web
    name: service01
    runtime: node
    plan: free
    region: frankfurt
    branch: claude/service-design-web-app-vdjcr0
    # Instala tudo (inclui devDeps para o build do frontend), gera o cliente
    # Prisma e compila o frontend.
    buildCommand: npm install --include=dev && npm run build:deploy
    # Sincroniza o schema com a base de dados e arranca o servidor.
    startCommand: npm run start:deploy
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: service01-db
          property: connectionString
      - key: AI_PROVIDER
        value: mock
      - key: NODE_VERSION
        value: "22.11.0"
